// --- VARIABLES ---
let currentQuestion = 0;
let userAnswers = new Array(questions.length).fill(null);
let shuffledQuestions = [];
let timeLeft;
let timerInterval;

// --- SHUFFLE QUESTIONS ---
function prepareQuestions() {
    shuffledQuestions = questions.map(q => {
        let options = q.options.map((opt, i) => ({
            text: opt,
            isCorrect: i === q.answer
        }));

        for (let i = options.length - 1; i > 0; i--) {
            let j = Math.floor(Math.random() * (i + 1));
            [options[i], options[j]] = [options[j], options[i]];
        }

        return { question: q.question, options: options };
    });
}

// --- START ---
function startExam() {
    prepareQuestions();
    timeLeft = parseInt(document.getElementById("timeSelect").value);

    document.getElementById("startScreen").style.display = "none";
    document.getElementById("quizScreen").style.display = "block";

    startTimer();
    loadQuestion();
}

// --- TIMER ---
function startTimer() {
    timerInterval = setInterval(() => {
        timeLeft--;

        let m = Math.floor(timeLeft / 60);
        let s = timeLeft % 60;

        document.getElementById("timer").innerText =
            `⏱ ${m}:${s < 10 ? "0" : ""}${s}`;

        if (timeLeft <= 0) {
            clearInterval(timerInterval);
            submitQuiz();
            alert("Time is up!");
        }
    }, 1000);
}

// --- LOAD QUESTION ---
function loadQuestion() {
    const q = shuffledQuestions[currentQuestion];

    let html = `<div class="question">${currentQuestion + 1}. ${q.question}</div><div class="options">`;

    q.options.forEach((opt, idx) => {
        const checked = userAnswers[currentQuestion] === idx ? "checked" : "";
        html += `
        <label id="label${idx}">
            <input type="radio" ${checked} onclick="checkAnswer(${idx})">
            ${opt.text}
        </label>`;
    });

    html += "</div>";

    document.getElementById("quiz").innerHTML = html;
    document.getElementById("feedback").innerText = "";

    if (userAnswers[currentQuestion] !== null) {
        showFeedback(userAnswers[currentQuestion]);
    }
}

// --- CHECK ---
function checkAnswer(idx) {
    userAnswers[currentQuestion] = idx;
    showFeedback(idx);
}

// --- FEEDBACK ---
function showFeedback(idx) {
    const q = shuffledQuestions[currentQuestion];

    q.options.forEach((opt, i) => {
        document.getElementById(`label${i}`).classList.remove("correct","wrong");
    });

    if (q.options[idx].isCorrect) {
        document.getElementById(`label${idx}`).classList.add("correct");
        document.getElementById("feedback").innerText = "✅ Correct!";
    } else {
        document.getElementById(`label${idx}`).classList.add("wrong");

        let correctIndex = q.options.findIndex(o => o.isCorrect);
        document.getElementById(`label${correctIndex}`).classList.add("correct");

        document.getElementById("feedback").innerText =
            `❌ Wrong! Correct answer: ${q.options[correctIndex].text}`;
    }
}

// --- NAVIGATION ---
function nextQuestion() {
    if (currentQuestion < shuffledQuestions.length - 1) {
        currentQuestion++;
        loadQuestion();
    }
}

function prevQuestion() {
    if (currentQuestion > 0) {
        currentQuestion--;
        loadQuestion();
    }
}

// --- SUBMIT ---
function submitQuiz() {
    clearInterval(timerInterval);

    let score = 0;

    userAnswers.forEach((ans, i) => {
        if (ans !== null && shuffledQuestions[i].options[ans].isCorrect) {
            score++;
        }
    });

    document.getElementById("quiz").style.display = "none";
    document.getElementById("feedback").style.display = "none";

    document.getElementById("result").innerText =
        `Your score: ${score} / ${questions.length}`;
}
